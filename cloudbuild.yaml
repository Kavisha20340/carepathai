steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'VITE_API_BASE_URL=$_VITE_API_BASE_URL',
      '-t', 'asia-south1-docker.pkg.dev/$PROJECT_ID/carepathai-repo/carepathai-frontend:$BUILD_ID',
      './frontend'
    ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-south1-docker.pkg.dev/$PROJECT_ID/carepathai-repo/carepathai-frontend:$BUILD_ID']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'carepathai-frontend'
      - '--image=asia-south1-docker.pkg.dev/$PROJECT_ID/carepathai-repo/carepathai-frontend:$BUILD_ID'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/carepathai-repo/carepathai-frontend:$BUILD_ID'

substitutions:
  _VITE_API_BASE_URL: ''



